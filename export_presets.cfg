; ProjectTower の書き出し（エクスポート）の設定。
; エディタの「プロジェクト > エクスポート」か、次のコマンドで書き出せる（エクスポートテンプレートが必要）:
;   godot --headless --path . --export-release "macOS" build/ProjectTower.app
;   godot --headless --path . --export-release "Windows Desktop" build/ProjectTower.exe

[preset.0]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="docs/*, tools/*, tests/*"
export_path="build/ProjectTower.app"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

application/icon=""
application/icon_interpolation=4
application/bundle_identifier="com.example.projecttower"
application/signature=""
application/app_category="Games"
application/short_version="1.0"
application/version="1.0"
application/copyright=""
display/high_res=true
codesign/codesign=0
notarization/notarization=0

[preset.1]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="docs/*, tools/*, tests/*"
export_path="build/ProjectTower.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

binary_format/embed_pck=true
application/icon=""
application/file_version="1.0.0.0"
application/product_version="1.0.0.0"
application/company_name="ProjectTower"
application/product_name="ProjectTower"
application/file_description="更地からビルを育てるシミュレーション"
application/copyright=""
