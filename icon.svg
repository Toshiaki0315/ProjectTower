<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" shape-rendering="crispEdges">
  <!-- ProjectTower のアイコン: 空を背景に、窓の明かりがともるビルと地面 -->
  <rect width="64" height="64" fill="#5aaef0"/>
  <!-- 太陽 -->
  <circle cx="52" cy="12" r="5" fill="#ffd966"/>
  <!-- 地面 -->
  <rect x="0" y="54" width="64" height="10" fill="#6b4a2a"/>
  <rect x="0" y="54" width="64" height="2" fill="#8a6440"/>
  <!-- ビル本体 -->
  <rect x="14" y="10" width="36" height="44" fill="#2b2f3a"/>
  <rect x="16" y="12" width="32" height="42" fill="#a9bdd0"/>
  <!-- 各階の床の線 -->
  <g fill="#2b2f3a">
    <rect x="16" y="20" width="32" height="2"/>
    <rect x="16" y="28" width="32" height="2"/>
    <rect x="16" y="36" width="32" height="2"/>
    <rect x="16" y="44" width="32" height="2"/>
  </g>
  <!-- 窓（いくつかは明かりがついている） -->
  <g fill="#cfe8ff">
    <rect x="19" y="14" width="5" height="5"/><rect x="27" y="14" width="5" height="5"/><rect x="35" y="14" width="5" height="5"/>
    <rect x="19" y="22" width="5" height="5"/><rect x="35" y="22" width="5" height="5"/><rect x="43" y="22" width="4" height="5"/>
    <rect x="27" y="30" width="5" height="5"/><rect x="35" y="30" width="5" height="5"/>
    <rect x="19" y="38" width="5" height="5"/><rect x="27" y="38" width="5" height="5"/><rect x="43" y="38" width="4" height="5"/>
  </g>
  <g fill="#ffd966">
    <rect x="43" y="14" width="4" height="5"/>
    <rect x="27" y="22" width="5" height="5"/>
    <rect x="19" y="30" width="5" height="5"/><rect x="43" y="30" width="4" height="5"/>
    <rect x="35" y="38" width="5" height="5"/>
  </g>
  <!-- 1階のロビーと入口 -->
  <rect x="16" y="46" width="32" height="8" fill="#e8eef2"/>
  <rect x="18" y="47" width="6" height="7" fill="#2a5aa0"/>
  <rect x="19" y="49" width="4" height="5" fill="#8a5a34"/>
  <g fill="#cfe8ff">
    <rect x="27" y="48" width="5" height="4"/><rect x="35" y="48" width="5" height="4"/><rect x="42" y="48" width="4" height="4"/>
  </g>
</svg>
